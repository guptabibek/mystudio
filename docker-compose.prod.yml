services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_STUDIO_NAME: ${NEXT_PUBLIC_STUDIO_NAME}
        NEXT_PUBLIC_STUDIO_TAGLINE: ${NEXT_PUBLIC_STUDIO_TAGLINE}
        NEXT_PUBLIC_STUDIO_EMAIL: ${NEXT_PUBLIC_STUDIO_EMAIL}
        NEXT_PUBLIC_STUDIO_PHONE: ${NEXT_PUBLIC_STUDIO_PHONE}
        NEXT_PUBLIC_STUDIO_PHONE_DISPLAY: ${NEXT_PUBLIC_STUDIO_PHONE_DISPLAY}
        NEXT_PUBLIC_STUDIO_ADDRESS: ${NEXT_PUBLIC_STUDIO_ADDRESS}
        NEXT_PUBLIC_STUDIO_WHATSAPP: ${NEXT_PUBLIC_STUDIO_WHATSAPP}
        NEXT_PUBLIC_STUDIO_HOURS: ${NEXT_PUBLIC_STUDIO_HOURS}
        NEXT_PUBLIC_STUDIO_INSTAGRAM: ${NEXT_PUBLIC_STUDIO_INSTAGRAM}
        NEXT_PUBLIC_STUDIO_PINTEREST: ${NEXT_PUBLIC_STUDIO_PINTEREST}
        NEXT_PUBLIC_STUDIO_TIKTOK: ${NEXT_PUBLIC_STUDIO_TIKTOK}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
